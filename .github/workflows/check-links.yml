name: Verificação de links — Cabine Zero 15

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verificar-links:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar todas as páginas do site
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_links.py
      - name: Salvar o estado de incidentes (se mudou)
        if: always()
        run: |
          git config user.name "monitor-cz15-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/incidents_week.csv
          git diff --cached --quiet || git commit -m "Atualiza estado de incidentes"
          git push
