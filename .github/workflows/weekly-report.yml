name: Relatório semanal — Cabine Zero 15

# Toda segunda-feira, 08:00 horário de Brasília (11:00 UTC).
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relatorio-semanal:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e enviar o relatório semanal
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python weekly_report.py

      - name: Zerar o arquivo de incidentes da semana
        run: |
          git config user.name "monitor-cz15-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/incidents_week.csv
          git diff --cached --quiet || git commit -m "Zera incidentes após envio do relatório semanal"
          git pull --rebase origin main
          git push
